<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — Shuren</title>
  <meta name="robots" content="noindex, follow">

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4">

  <!-- Fonts (local) -->
  <link rel="preload" href="/assets/fonts/syne-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/lato-400.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/style.css?v=13">
  <script>
    (function () { var d = document.documentElement, t; d.classList.add('js'); try { t = localStorage.getItem('theme'); } catch (e) { } d.setAttribute('data-theme', t || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light')); })();
  </script>

  <style>
    .erreur {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }
    .erreur-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
    }
    .erreur-code {
      font-family: var(--font-titre);
      font-weight: 700;
      font-size: clamp(4.5rem, 20vw, 9rem);
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--texte);
    }
    .erreur-titre {
      font-family: var(--font-titre);
      font-weight: 700;
      font-size: clamp(1.25rem, 5vw, 1.75rem);
      margin-top: 12px;
      color: var(--texte);
    }
    .erreur-texte {
      color: var(--texte-doux);
      max-width: 460px;
      margin: 16px auto 36px;
    }
    .erreur-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
  </style>
</head>

<body>
  <main class="erreur">
    <a href="/" class="erreur-logo" aria-label="Retour à l'accueil Shuren">
      <img src="/assets/logos/logo-no-shuren-black-on-white.svg" alt="" class="nav-logo-mark" width="32" height="32">
      <img src="/assets/logos/Just-Shuren-black-on-white.svg" alt="Shuren" class="nav-logo-text" width="80" height="18">
    </a>

    <div class="erreur-code">404</div>
    <h1 class="erreur-titre">Cette page n'existe pas</h1>
    <p class="erreur-texte">Le lien est peut-être erroné, ou la page a été déplacée. Revenez à l'accueil ou contactez-nous.</p>

    <div class="erreur-actions">
      <a href="/" class="btn-plein">Retour à l'accueil</a>
      <a href="/contact" class="btn-outline">Nous contacter</a>
    </div>
  </main>
</body>

</html>
